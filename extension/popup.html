<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Inserate-Assistent</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font:
          14px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: #101828;
        background: #fff;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        color: #475467;
      }
      ol {
        margin: 0;
        padding-left: 18px;
        color: #475467;
      }
      li {
        margin-bottom: 6px;
      }
      .status {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #f2f4f7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Inserate-Assistent</h1>
    <p>Aktiv auf eBay, Kleinanzeigen und Vinted.</p>
    <ol>
      <li>In der App den Artikel öffnen und auf „Veröffentlichen“ tippen.</li>
      <li>Das Verkaufsformular öffnet sich und wird automatisch ausgefüllt.</li>
      <li>Kurz prüfen und selbst auf „Angebot einstellen“ klicken.</li>
    </ol>
    <div class="status" id="status">Bereit.</div>
    <script src="popup.js"></script>
  </body>
</html>
